name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o KitchenERP_Android_Project.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
- name: Find project
  run: |
    find project -name gradlew -type f

- name: Build APK
  run: |
    chmod +x $(find project -name gradlew -type f | head -1)
    GRADLEW=$(find project -name gradlew -type f | head -1)
    PROJECT_DIR=$(dirname "$GRADLEW")
    cd "$PROJECT_DIR"
    ./gradlew assembleDebug

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: app-debug
    path: project/**/build/outputs/apk/**/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/**/*.apk
