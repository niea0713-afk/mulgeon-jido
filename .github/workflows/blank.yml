name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip fixed project
        run: |
          rm -rf project
          unzip -q KitchenERP_Android_Project_FIXED.zip -d project
          test -f project/KitchenERP_Android_Project/settings.gradle.kts
          test -f project/KitchenERP_Android_Project/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project/KitchenERP_Android_Project
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/KitchenERP_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
