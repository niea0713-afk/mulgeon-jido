name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o KitchenERP_Android_Project.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/KitchenERP_Android_Project/KitchenERP_Android_Project/gradle.properties

      - name: Force Java 17
        run: |
          cat > /tmp/force-java17.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }
          }
          EOF

      - name: Build APK
        working-directory: project/KitchenERP_Android_Project/KitchenERP_Android_Project
        run: |
          gradle -I /tmp/force-java17.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/KitchenERP_Android_Project/KitchenERP_Android_Project/**/build/outputs/apk/**/*.apk
